name: Claude Code (reusable)

# Runs Claude Code in response to @claude mentions or a `claude` label.
# Authenticates with the CLAUDE_CODE_OAUTH_TOKEN secret, a Claude
# subscription token from `claude setup-token`, so runs count against that
# subscription's usage limits. Callers pass it by name (`secrets:
# CLAUDE_CODE_OAUTH_TOKEN: ...`); `secrets: inherit` doesn't reach this
# workflow from repositories outside the waldronlab organization.
#
# On a pull request, Claude is told to read the changes with `gh pr diff`
# and, when asked for a review, to follow the same instructions as
# claude-review.yml, including `review_focus`.
#
# Usage: see "Claude Code" in this repository's README.

on:
  workflow_call:
    inputs:
      trigger_phrase:
        description: "Phrase in a comment, issue body or issue title that invokes Claude"
        required: false
        type: string
        default: "@claude"
      label_trigger:
        description: "Issue label that invokes Claude when applied"
        required: false
        type: string
        default: "claude"
      claude_args:
        description: "Extra Claude Code CLI arguments, e.g. --model or --max-turns"
        required: false
        type: string
        default: ""
      timeout_minutes:
        description: "Job timeout, which also caps usage per run"
        required: false
        type: number
        default: 30
      review_focus:
        description: "Repository-specific review instructions, used on pull requests; pass the same text as to claude-review.yml"
        required: false
        type: string
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "Claude subscription token from `claude setup-token`"
        required: true

jobs:
  claude:
    # A skipped job uses no runner minutes, so callers can trigger this on
    # every comment and let this filter decide.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, inputs.trigger_phrase)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, inputs.trigger_phrase)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, inputs.trigger_phrase)) ||
      (github.event_name == 'issues' && (
        contains(github.event.issue.body, inputs.trigger_phrase) ||
        contains(github.event.issue.title, inputs.trigger_phrase) ||
        (github.event.action == 'labeled' && github.event.label.name == inputs.label_trigger)))
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # the action exchanges an OIDC token for the Claude GitHub App token
      actions: read # lets Claude read CI results on PRs
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # On a pull request, add the review instructions from claude-review.yml
      # to the system prompt. The checkout is shallow, so `git diff
      # origin/<base>...HEAD` finds no merge base; `gh pr diff` needs no
      # history. A `prompt` input would switch the action out of tag mode, so
      # the instructions go in a file passed with --append-system-prompt-file.
      - name: Write pull request instructions
        id: pr
        if: github.event.issue.pull_request || github.event.pull_request
        env:
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REVIEW_FOCUS: ${{ inputs.review_focus }}
        run: |
          file="$RUNNER_TEMP/claude-pr-instructions.md"
          {
            # shellcheck disable=SC2016 # the backticks are Markdown
            printf 'This request is on pull request #%s. To see the pull request and its changes, run `gh pr view %s` and `gh pr diff %s` (always give the number). Do not use `git diff` against the base branch: the checkout is shallow and has no merge base.\n\n' "$PR_NUMBER" "$PR_NUMBER" "$PR_NUMBER"
            cat <<'EOF'
          If you are asked to review the pull request, report only things worth the author's time:
          - bugs and incorrect results, including statistical or data-handling errors;
          - changes that break existing callers, documentation or tests;
          - missing tests for new behaviour;
          - security problems.
          Skip style preferences that a linter would catch, and don't praise or summarise the pull request back to the author. Put each specific issue in an inline comment on the relevant line, using mcp__github_inline_comment__create_inline_comment with `confirmed: true`, and say how to fix it. Then, in your reply, list the most important issues in order, or say plainly that you found nothing worth raising.
          EOF
            if [ -n "$REVIEW_FOCUS" ]; then
              printf '\nRepository-specific review instructions:\n%s\n' "$REVIEW_FOCUS"
            fi
          } > "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: ${{ inputs.trigger_phrase }}
          label_trigger: ${{ inputs.label_trigger }}
          claude_args: |
            ${{ steps.pr.outputs.file && format('--append-system-prompt-file {0} --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"', steps.pr.outputs.file) || '' }}
            ${{ inputs.claude_args }}

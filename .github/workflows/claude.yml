name: Claude Code (reusable)

# Runs Claude Code in response to @claude mentions or a `claude` label.
# Authenticates to the Claude API with workload identity federation: the
# calling job's GitHub OIDC token is exchanged for a short-lived Anthropic
# token, so no API key is stored anywhere. The IDs below are identifiers,
# not credentials. The federation rule in the Claude Console accepts tokens
# only from repositories in the waldronlab organization.
#
# Usage: see "claude.yml" in this repository's README.

on:
  workflow_call:
    inputs:
      trigger_phrase:
        description: "Phrase in a comment, issue body or issue title that invokes Claude"
        required: false
        type: string
        default: "@claude"
      label_trigger:
        description: "Issue label that invokes Claude when applied"
        required: false
        type: string
        default: "claude"
      claude_args:
        description: "Extra Claude Code CLI arguments, e.g. --model or --max-turns"
        required: false
        type: string
        default: ""
      timeout_minutes:
        description: "Job timeout, which also caps spend per run"
        required: false
        type: number
        default: 30

jobs:
  claude:
    # A skipped job uses no runner minutes, so callers can trigger this on
    # every comment and let this filter decide.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, inputs.trigger_phrase)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, inputs.trigger_phrase)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, inputs.trigger_phrase)) ||
      (github.event_name == 'issues' && (
        contains(github.event.issue.body, inputs.trigger_phrase) ||
        contains(github.event.issue.title, inputs.trigger_phrase) ||
        (github.event.action == 'labeled' && github.event.label.name == inputs.label_trigger)))
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # required for the OIDC token used by federation
      actions: read # lets Claude read CI results on PRs
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_federation_rule_id: fdrl_01X83Zk3FZmVxU51RcTyhhkP
          anthropic_organization_id: 9e396bea-64ac-4ec3-b30a-483bbbf0b805
          anthropic_service_account_id: svac_0196kZwByri8hG9BLAZD2R7H
          anthropic_workspace_id: wrkspc_01Cb3FmbDkgCwFVg3NqyYDST
          trigger_phrase: ${{ inputs.trigger_phrase }}
          label_trigger: ${{ inputs.label_trigger }}
          claude_args: ${{ inputs.claude_args }}

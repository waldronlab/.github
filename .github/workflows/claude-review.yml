name: Claude PR review (reusable)

# Reviews a pull request once, when it is opened or marked ready for review,
# and posts inline comments plus one summary comment. It doesn't re-review on
# every push; ask for another review by commenting `@claude review` (handled
# by claude.yml).
#
# Authenticates with the CLAUDE_CODE_OAUTH_TOKEN secret (a Claude
# subscription token), so runs count against that subscription's usage
# limits. Draft PRs, bot PRs and PRs from forks are skipped: secrets aren't
# available to fork PRs.
#
# Usage: see "claude-review.yml" in this repository's README.

on:
  workflow_call:
    inputs:
      review_focus:
        description: "Extra, repository-specific instructions appended to the review prompt"
        required: false
        type: string
        default: ""
      claude_args:
        description: "Extra Claude Code CLI arguments, e.g. --model or --max-turns"
        required: false
        type: string
        default: ""
      timeout_minutes:
        description: "Job timeout"
        required: false
        type: number
        default: 20
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "Claude subscription token from `claude setup-token`"
        required: true

jobs:
  review:
    if: |
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      id-token: write # the action requests an OIDC token for the Claude GitHub App
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is checked out in the
            current directory; run
            `gh pr view ${{ github.event.pull_request.number }}` and
            `gh pr diff ${{ github.event.pull_request.number }}` first (always
            give the PR number: the checkout is a detached merge commit), and
            read surrounding code where the diff alone isn't enough.

            Report only things worth the author's time:
            - bugs and incorrect results, including statistical or
              data-handling errors;
            - changes that break existing callers, documentation or tests;
            - missing tests for new behaviour;
            - security problems.
            Skip style preferences that a linter would catch, and don't
            praise or summarise the PR back to the author.

            Put each specific issue in an inline comment on the relevant
            line, using mcp__github_inline_comment__create_inline_comment
            with `confirmed: true`, and say how to fix it. Then post one
            top-level comment with
            `gh pr comment ${{ github.event.pull_request.number }}` that lists the most
            important issues in order, or says plainly that you found
            nothing worth raising. Only post GitHub comments; don't put
            review text in your final message.

            ${{ inputs.review_focus }}
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob,LS"
            ${{ inputs.claude_args }}

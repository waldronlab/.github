name: Bioc PR CMD check & (optional) pkgdown + Docker

on:
  workflow_call:
    inputs:
      cran:
        description: "CRAN-like repo URL to use"
        required: false
        type: string
        default: "https://p3m.dev/cran/__linux__/noble/latest"
      enable_pkgdown:
        description: "If true, build + deploy pkgdown when on a RELEASE_* branch push"
        required: false
        type: boolean
        default: true
      enable_docker:
        description: "If true, build/push docker when Dockerfile exists and on devel push"
        required: false
        type: boolean
        default: true
      dockerfile_path:
        description: "Path to Dockerfile to build (if present)"
        required: false
        type: string
        default: "inst/docker/pkg/Dockerfile"
    secrets:
      CODECOV_TOKEN:
        required: false
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

env:
  R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
  CRAN: ${{ inputs.cran }}

  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  set-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      dockerfile_exists: ${{ steps.dockerfile.outputs.exists }}
      is_release_branch: ${{ steps.branch.outputs.is_release_branch }}
      ref_name: ${{ steps.branch.outputs.ref_name }}
    steps:
      - name: Determine ref name + release-branch status
        id: branch
        shell: bash
        run: |
          # For PRs, use the target branch (base_ref). For pushes, use ref_name.
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            REF_NAME="${{ github.base_ref }}"
          else
            REF_NAME="${GITHUB_REF_NAME}"
          fi

          echo "ref_name=${REF_NAME}" >> "$GITHUB_OUTPUT"

          if [[ "${REF_NAME}" =~ ^RELEASE_ ]]; then
            echo "is_release_branch=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release_branch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set Matrix (docker tag + checkout ref)
        id: set
        shell: bash
        run: |
          DOCKER_TAG="devel"

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            CHECKOUT_REF="${{ github.event.pull_request.head.sha }}"
          else
            CHECKOUT_REF="${GITHUB_REF_NAME}"
          fi

          MATRIX="{\"include\":[{\"docker_tag\":\"${DOCKER_TAG}\",\"checkout_ref\":\"${CHECKOUT_REF}\"}]}"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      - name: Check for Dockerfile
        id: dockerfile
        shell: bash
        run: |
          if [ -f "./${{ inputs.dockerfile_path }}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: set-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}

    container: ghcr.io/bioconductor/bioconductor_docker:${{ matrix.docker_tag }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.checkout_ref }}

      - name: Query dependencies
        run: |
          options(repos = c(CRAN = Sys.getenv("CRAN")))
          BiocManager::install(c("remotes", "rcmdcheck", "BiocCheck", "covr", "cffr", "V8"))
          saveRDS(remotes::dev_package_deps(dependencies = TRUE), ".github/depends.Rds", version = 2)
        shell: Rscript {0}

      - name: Check CITATION.cff version matches DESCRIPTION
        id: citation_check
        if: ${{ github.event_name != 'pull_request' }}
        shell: Rscript {0}
        run: |
          desc <- read.dcf("DESCRIPTION")
          if (!("Version" %in% colnames(desc))) {
            stop("DESCRIPTION is missing required 'Version' field.")
          }
          pkg_version <- as.character(desc[1, "Version"])
          output_file <- Sys.getenv("GITHUB_OUTPUT")

          if (!file.exists("CITATION.cff")) {
            writeLines(
              c(
                "has_cff=false",
                "version_match=true",
                paste0("pkg_version=", pkg_version)
              ),
              output_file
            )
            quit(save = "no")
          }

          cff_version <- tryCatch(
            as.character(cffr::cff_read("CITATION.cff")$version),
            error = function(e) {
              message("Unable to parse CITATION.cff: ", conditionMessage(e))
              ""
            }
          )
          version_match <- nzchar(cff_version) && identical(pkg_version, cff_version)

          writeLines(
            c(
              "has_cff=true",
              paste0("pkg_version=", pkg_version),
              paste0("cff_version=", cff_version),
              paste0("version_match=", tolower(as.character(version_match)))
            ),
            output_file
          )

      - name: Update CITATION.cff package version
        if: >-
          ${{
            github.event_name != 'pull_request'
            && steps.citation_check.outputs.has_cff == 'true'
            && steps.citation_check.outputs.version_match != 'true'
          }}
        env:
          PKG_VERSION: ${{ steps.citation_check.outputs.pkg_version }}
        run: |
          cff <- cffr::cff_read("CITATION.cff")
          cff <- cffr::cff_modify(cff, version = Sys.getenv("PKG_VERSION"))
          cffr::cff_write(cff, outfile = "CITATION.cff", validate = TRUE, verbose = FALSE)
        shell: Rscript {0}

      - name: Commit CITATION.cff version update
        if: >-
          ${{
            github.event_name != 'pull_request'
            && steps.citation_check.outputs.has_cff == 'true'
            && steps.citation_check.outputs.version_match != 'true'
          }}
        shell: bash
        run: |
          set -euo pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CITATION.cff
          if git diff --cached --quiet; then
            echo "No CITATION.cff changes to commit"
            exit 0
          fi
          git commit -m "Update CITATION.cff version to match DESCRIPTION"
          git push

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/R/site-library
          key: ${{ runner.os }}-r-${{ matrix.checkout_ref }}-${{ hashFiles('.github/depends.Rds') }}
          restore-keys: |
            ${{ runner.os }}-r-${{ matrix.checkout_ref }}-

      - name: Install GPG
        if: ${{ github.ref == 'refs/heads/devel' && github.event_name != 'pull_request' }}
        run: sudo apt-get update && sudo apt-get install -y gpg

      - name: Install Dependencies
        run: |
          options(repos = c(CRAN = Sys.getenv("CRAN")))
          remotes::install_deps(dependencies = TRUE, repos = BiocManager::repositories())
          BiocManager::install(ask = FALSE, update = TRUE)
        shell: Rscript {0}

      - name: Check Package
        env:
          _R_CHECK_CRAN_INCOMING_REMOTE_: false
        run: rcmdcheck::rcmdcheck(args = "--no-manual", error_on = "error", check_dir = "check")
        shell: Rscript {0}

      - name: Test coverage
        if: ${{ success() && github.ref == 'refs/heads/devel' && github.event_name != 'pull_request' }}
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            type = "all",
            install_path = file.path(
              normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"),
              "package"
            )
          )
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - name: Upload test results to Codecov
        if: ${{ success() && github.ref == 'refs/heads/devel' && github.event_name != 'pull_request' && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: ${{ github.event_name != 'pull_request' && true || false }}
          file: ./cobertura.xml
          plugin: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Run BiocCheck
        id: bioccheck
        run: |
          BiocCheck::BiocCheck(
            dir('check', 'tar.gz$', full.names = TRUE),
            `quit-with-status` = TRUE, `no-check-bioc-help` = TRUE
          )
        shell: Rscript {0}

      - name: Build pkgdown
        if: >-
          ${{
            inputs.enable_pkgdown
            && github.event_name != 'pull_request'
            && needs.set-matrix.outputs.is_release_branch == 'true'
          }}
        run: |
          PATH=$PATH:$HOME/bin/ Rscript -e 'pkgdown::build_site()'

      - name: Upload pkgdown artifact
        if: >-
          ${{
            inputs.enable_pkgdown
            && needs.set-matrix.outputs.is_release_branch == 'true'
          }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  dock:
    needs:
      - check
      - set-matrix
    runs-on: ubuntu-24.04
    if: >-
      ${{
        inputs.enable_docker
        && github.ref == 'refs/heads/devel'
        && github.event_name != 'pull_request'
        && needs.set-matrix.outputs.dockerfile_exists == 'true'
      }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Register repo name
        id: reg_repo_name
        shell: bash
        run: |
          echo "CONT_IMG_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ inputs.dockerfile_path }}
          push: true
          tags: >
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.CONT_IMG_NAME }}:latest,
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.CONT_IMG_NAME }}:devel

  deploy:
    needs:
      - check
      - set-matrix
    if: >-
      ${{
        inputs.enable_pkgdown
        && github.event_name != 'pull_request'
        && needs.set-matrix.outputs.is_release_branch == 'true'
      }}
    permissions:
      contents: write
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
